[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["larq/snapshots"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["I", "E", "W", "F", "B", "UP"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.10"
files = ["larq"]
exclude = ["larq/snapshots"]
ignore_missing_imports = true
