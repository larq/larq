name: Unittest

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tf-version: 2.8.4
            python-version: "3.10"
          - tf-version: 2.9.3
            python-version: "3.10"
          - tf-version: 2.10.1
            python-version: "3.10"
          - tf-version: 2.11.1
            python-version: "3.10"
          - tf-version: 2.12.0
            python-version: "3.11"
          - tf-version: 2.13.0
            python-version: "3.11"
          - tf-version: 2.14.0
            python-version: "3.11"
          - tf-version: 2.15.0
            python-version: "3.11"
          - tf-version: 2.16.1
            python-version: "3.11"
          - tf-version: 2.17.0
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install 'protobuf < 3.20'
          pip install tensorflow-cpu==${{matrix.tf-version}} || pip install tensorflow==${{matrix.tf-version}}
          pip install -e .[test]
      - name: Install legacy tf-keras
        if: matrix.tf-version == '2.16.1'
        run: pip install tf-keras==2.16.0
      - name: Install legacy tf-keras
        if: matrix.tf-version == '2.17.0'
        run: pip install tf-keras==2.17.0
      - name: Test with pytest
        run: |
          if [[ "${{ matrix.tf-version }}" == "2.16.1" || "${{ matrix.tf-version }}" == "2.17.0" ]]; then
            export TF_USE_LEGACY_KERAS=1
          fi
          pytest . -n auto --cov=larq --cov-report=xml --cov-config=.coveragerc
      - name: Upload coverage to Codecov
        run: bash <(curl -s https://codecov.io/bash) -f ./coverage.xml -F unittests
